    if (el) { el.focus({ preventScroll: false }); }
  }
}

function isActiveGap(task, id, mode) { return !(mode === "mistakes" && task.gaps[id].ok); }

function renderGap(task, id, mode) {
  const g = task.gaps[id];
  const num = `<span class="gapno">${id.replace(/^[A-Z]/, "")}</span>`;
  const cue = g.cue ? `<span class="cue">(${esc(g.cue)})</span> ` : "";
  if (!isActiveGap(task, id, mode)) {
    return `${cue}<span class="gap-fixed" title="Correct in July">${esc(g.her)}</span>`;
  }
  const st = gapState(task.id, mode, id) || {};
  const cls = st.status === "right" ? "is-right" : st.status === "wrong" ? "is-wrong" : st.status === "revealed" ? "is-revealed" : "";
  const was = mode === "mistakes" && !g.ok ? `<span class="was" aria-label="Your July answer">${esc(g.her)}</span>` : "";
  const val = st.status === "revealed" && !st.val ? "" : (st.val || "");
  const label = `Gap ${id.replace(/^[A-Z]/, "")}${g.cue ? ", verb " + g.cue : ""}`;
  if (task.kind === "select") {
    const opts = ['<option value="">choose…</option>'].concat(task.bank.map(b => `<option ${b === val ? "selected" : ""}>${esc(b)}</option>`)).join("");
    return `<span class="gapwrap">${num}${was}<select class="gap-input ${cls}" data-gap="${id}" aria-label="${esc(label)}" ${st.status === "right" ? "disabled" : ""}>${opts}</select></span>`;
  }
  return `${cue}<span class="gapwrap">${num}${was}<input class="gap-input ${task.width || ""} ${cls}" data-gap="${id}" value="${esc(val)}" aria-label="${esc(label)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${st.status === "right" ? "readonly" : ""}></span>`;
}

function checkGap(task, id, mode, rerender) {
  const g = task.gaps[id];
  const st = gapState(task.id, mode, id) || { tries: 0 };
  const el = document.querySelector(`[data-gap="${id}"]`);
  const val = el ? el.value : (st.val || "");
  if (!String(val).trim()) return;
  st.val = val;
  if (matchAny(val, g.key)) { st.status = "right"; st.alsoNote = false; }
  else if (matchAny(val, g.also)) { st.status = "right"; st.alsoNote = true; }
  else { st.status = "wrong"; st.tries = (st.tries || 0) + 1; }
  setGapState(task.id, mode, id, st);
  if (rerender) {
    let next = null;
    if (st.status === "right") {
      const order = task.paras.join(" ").match(/\{\{(\w+)\}\}/g).map(m => m.slice(2, -2));
      const after = order.slice(order.indexOf(id) + 1).concat(order.slice(0, order.indexOf(id)));
      next = after.find(x => isActiveGap(task, x, mode) && !((gapState(task.id, mode, x) || {}).status === "right")) || null;
    } else next = id;
    renderTask(task, task.kind === "select" ? null : next);
  }
}

function renderFeedback(task, id, mode) {
  const g = task.gaps[id];
  if (!isActiveGap(task, id, mode)) return "";
  const st = gapState(task.id, mode, id);
  if (!st || !st.status || st.status === "pending") return "";
  const n = id.replace(/^[A-Z]/, "");
  const head = `Gap ${n}${g.cue ? ` · (${esc(g.cue)})` : ""}`;
  const keyTxt = esc(g.key[0]);
  const src = g.page ? `<p class="src">${esc(g.page)}</p>` : "";
  const flag = g.flag ? `<span class="flag">reconstructed key – both readings accepted${g.also ? ": " + g.also.concat(g.key).filter((v, i, a) => a.indexOf(v) === i).map(esc).join(" / ") : ""}</span>` : "";
  const others = g.key.filter((k, i) => i > 0 && !(st.val && same(k, st.val)));
  const alts = others.length ? `<p class="small muted">Also correct: ${others.map(esc).join(" · ")}</p>` : "";
  const july = !g.ok ? `<p><b>Why “${esc(g.her)}” was wrong:</b> ${g.why || ""}</p>` : `<p class="small muted">You had this one right in July (“${esc(g.her)}”).</p>`;
  if (st.status === "right") {
    const model = !same(st.val, g.key[0]) ? `<p class="small">${st.alsoNote ? "<b>Accepted</b> – but the" : "The"} model answer is <b>${keyTxt}</b>.</p>` : "";
    return `<div class="fb right"><span class="fb-title">✓ ${head} – ${esc(st.val)}</span>${model}${july}<p><b>Rule:</b> ${g.rule}</p>${alts}${flag}${src}</div>`;
  }
  if (st.status === "revealed") {
    const altsRev = g.key.length > 1 ? `<p class="small muted">Also correct: ${g.key.slice(1).map(esc).join(" · ")}</p>` : "";
    return `<div class="fb revealed"><span class="fb-title">${head} – answer: <span class="ans">${keyTxt}</span></span>${july}<p><b>Rule:</b> ${g.rule}</p>${altsRev}${flag}${src}<p class="small muted">Type it in now to lock it in.</p></div>`;
  }
  // wrong
  const hint = g.hint ? `<p><b>Hint:</b> ${g.hint}</p>` : `<p><b>Rule:</b> ${g.rule}</p>`;
  const again = (st.tries || 0) >= 2 ? `<p class="small">Still stuck? Look at the hint again – or show the answer.</p>` : "";
  const sameAsJuly = !g.ok && same(st.val, g.her) ? `<p class="small"><b>That’s exactly your July answer.</b></p>` : "";
  return `<div class="fb wrong"><span class="fb-title">✗ ${head} – “${esc(st.val)}” is not it yet</span>${sameAsJuly}${hint}${again}<div class="btn-row" style="margin-top:8px"><button class="button small" data-reveal="${id}">Show answer</button></div></div>`;
}

/* ---------- MC task (theory) ---------- */
function renderMCTask() {
  const area = $("#task-area");
  const list = S.ui.mcAll ? MC : MC.filter(q => q.her !== q.ans);
  area.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="task-head">
        <div><p class="eyebrow">Theory &amp; analysis · July 8/15 · fixed ${taskRepaired("mc").n}/${taskRepaired("mc").total}</p><p class="small muted" style="margin:0">Your July choice is tagged <span class="tag red">July</span>. Choose again – the explanation appears after your choice.</p></div>
        <div class="toggle" role="group" aria-label="Which questions">
          <button data-mcall="0" class="${!S.ui.mcAll ? "is-active" : ""}">Only my 7 mistakes</button>
          <button data-mcall="1" class="${S.ui.mcAll ? "is-active" : ""}">All 15</button>
        </div>
      </div>
    </div>
    ${list.map(q => mcCard(q)).join("")}
    <div class="btn-row" style="margin-top:14px"><button class="button ghost small" id="mc-reset">Reset choices</button></div>`;
  area.querySelectorAll("[data-mcall]").forEach(b => b.addEventListener("click", () => { S.ui.mcAll = b.dataset.mcall === "1"; save(); renderMCTask(); }));
  area.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    const q = MC.find(x => x.id === b.dataset.q); const choice = Number(b.dataset.i);
    S.mc[q.id] = { choice, right: choice === q.ans }; save();
    renderMCTask();
    const card = document.getElementById(q.id); if (card) card.scrollIntoView({ block: "nearest" });
  }));
  $("#mc-reset").addEventListener("click", () => { S.mc = {}; save(); renderMCTask(); });
}
function mcCard(q) {
  const st = S.mc[q.id];
  const wasWrong = q.her !== q.ans;
  const letters = ["a", "b", "c", "d"];
  const opts = q.opts.map((o, i) => {
    let cls = "";
    if (st) { if (i === q.ans && (st.right || st.choice === i)) cls = "is-right"; if (st.choice === i && !st.right) cls = "is-wrong"; if (st && !st.right && i === q.ans && st.reveal) cls = "is-right"; }
    const july = i === q.her ? `<span class="tag ${wasWrong ? "red" : "green"}">July</span>` : "";
    return `<button class="opt ${cls}" data-q="${q.id}" data-i="${i}">${letters[i]}. ${esc(o)}${july}</button>`;
  }).join("");
  let fb = "";
  if (st) {
    fb = st.right
      ? `<div class="fb right" style="margin-top:10px"><span class="fb-title">✓ Right.</span><p>${q.why}</p><p class="src">${esc(q.page)}</p></div>`
      : `<div class="fb wrong" style="margin-top:10px"><span class="fb-title">✗ Not this one.</span><p class="small">Think about the rule and choose again.</p></div>`;
  }
  return `<div class="card mc" id="${q.id}"><p class="eyebrow">Question ${q.id.replace("mc", "")} ${wasWrong ? '<span class="tag red">wrong in July</span>' : '<span class="tag green">right in July</span>'}</p><p class="mc-q">${esc(q.q)}</p><div class="opts">${opts}</div>${fb}</div>`;
}

/* ---------- RULES ---------- */
function renderRules() {
  const root = $("#view-rules");
  root.innerHTML = `<div class="card" style="margin-bottom:18px"><p class="eyebrow">Repair kit</p><h2>The rules behind your 36 lost points</h2><p class="muted" style="margin:0">Each card: the rule, then <b style="color:var(--red)">your July slip</b>. Tick “I can explain it” only if you could teach it to someone.</p></div>` +
    RULES.map(g => `<div class="rule-group"><p class="eyebrow">${g.group}</p><div class="grid grid-2">${g.items.map(r => `
      <div class="card rule ${S.rules[r.id] ? "is-known" : ""}">
        <button class="button small ${S.rules[r.id] ? "primary" : "ghost"} know" data-rule="${r.id}">${S.rules[r.id] ? "✓ Got it" : "I can explain it"}</button>
        <h3>${r.title}</h3>
        <ul>${r.body.map(b => `<li>${b}</li>`).join("")}</ul>
        ${r.yours ? `<div class="yours"><b>July:</b> ${r.yours}</div>` : ""}
        ${r.page ? `<p class="src small muted" style="margin:8px 0 0">${r.page}</p>` : ""}
      </div>`).join("")}</div></div>`).join("");
  root.querySelectorAll("[data-rule]").forEach(b => b.addEventListener("click", () => { S.rules[b.dataset.rule] = !S.rules[b.dataset.rule]; save(); renderRules(); }));
}

/* ---------- DRILLS ---------- */
const recentDrills = new Set(); // answered in this filter session – stay visible until the filter changes
function renderDrills(focusId) {
  const root = $("#view-drills");
  const cat = S.ui.cat;
  let list = DRILLS.filter(d => cat === "all" || d.cat === cat);
  if (S.ui.openOnly) list = list.filter(d => recentDrills.has(d.id) || !(S.drills[d.id] && S.drills[d.id].status === "right"));
  const right = DRILLS.filter(d => S.drills[d.id] && S.drills[d.id].status === "right").length;
  const wrongEver = DRILLS.filter(d => S.drills[d.id] && S.drills[d.id].missed).length;
  root.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <p class="eyebrow">Transfer · new sentences, same traps</p>
      <h2>${right} / ${DRILLS.length} right</h2>
      <p class="muted small" style="margin:0">Typed gaps work like Moodle: type exactly what belongs in the gap. Relatives: comma inside the gap (<span class="kbd">, who</span>), contact clause = <span class="kbd">C</span> – exam rule: if C is possible you MUST write C (that/which/who would lose the point). ${wrongEver ? `${wrongEver} drills needed more than one try – they stay in “Only not yet right” until you get them.` : ""}</p>
    </div>
    <div class="filters">
      ${CATS.map(c => `<button class="chip ${cat === c.id ? "is-active" : ""}" data-cat="${c.id}">${c.label}</button>`).join("")}
      <label class="small" style="margin-left:auto;display:flex;gap:6px;align-items:center"><input type="checkbox" id="open-only" ${S.ui.openOnly ? "checked" : ""}> Only not yet right</label>
      <button class="button ghost small" id="drill-reset">Reset drills</button>
    </div>
    <div id="drill-list">${list.length ? list.map(drillCard).join("") : `<div class="card"><p style="margin:0">Nothing left here – all right. 🎉</p></div>`}</div>`;
  root.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => { S.ui.cat = b.dataset.cat; recentDrills.clear(); save(); renderDrills(); }));
  $("#open-only").addEventListener("change", e => { S.ui.openOnly = e.target.checked; recentDrills.clear(); save(); renderDrills(); });
  $("#drill-reset").addEventListener("click", () => { S.drills = {}; recentDrills.clear(); save(); renderDrills(); });
  root.querySelectorAll(".drill input.gap-input").forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkDrill(inp.dataset.drill, inp.value); } });
    inp.addEventListener("input", () => { const st = S.drills[inp.dataset.drill] || {}; st.val = inp.value; S.drills[inp.dataset.drill] = st; save(); });
  });
  root.querySelectorAll("[data-check]").forEach(b => b.addEventListener("click", () => { const inp = root.querySelector(`input[data-drill="${b.dataset.check}"]`); checkDrill(b.dataset.check, inp ? inp.value : ""); }));
  root.querySelectorAll("[data-dopt]").forEach(b => b.addEventListener("click", () => checkDrill(b.dataset.dopt, Number(b.dataset.i))));
  root.querySelectorAll("[data-dreveal]").forEach(b => b.addEventListener("click", () => { const st = S.drills[b.dataset.dreveal] || {}; st.reveal = true; st.missed = true; S.drills[b.dataset.dreveal] = st; save(); renderDrills(); }));
  if (focusId) { const el = root.querySelector(`#d-${focusId}`); if (el) el.scrollIntoView({ block: "nearest" }); }
}
// Modal drills list the key first in the data – move it to a varying position (item number mod option count).
function optionOrder(d) {
  const idx = d.opts.map((_, i) => i);
  if (d.cat !== "modal") return idx;
  const rest = idx.filter(i => i !== d.ans);
  const pos = Number(d.id.replace(/\D/g, "")) % d.opts.length;
  rest.splice(pos, 0, d.ans);
  return rest;
}
function drillCard(d) {
  const st = S.drills[d.id] || {};
  const catLabel = CATS.find(c => c.id === d.cat).label;
  let body = "";
  if (d.type === "type") {
    const cls = st.status === "right" ? "is-right" : st.status === "wrong" ? "is-wrong" : "";
    body = `<div class="drill-row"><input class="gap-input ${cls}" data-drill="${d.id}" value="${esc(st.val || "")}" aria-label="Answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${st.status === "right" ? "readonly" : ""}><button class="button small primary" data-check="${d.id}">Check</button></div>`;
  } else {
    body = `<div class="opts">${optionOrder(d).map(i => {
      const o = d.opts[i];
      let cls = ""; if (st.status && st.choice === i) cls = st.status === "right" ? "is-right" : "is-wrong";
      if (st.reveal && i === d.ans) cls = "is-right";
      return `<button class="opt ${cls}" data-dopt="${d.id}" data-i="${i}">${esc(o)}</button>`;
    }).join("")}</div>`;
  }
  let fb = "";
  const answer = d.type === "type" ? d.keys[0] : d.opts[d.ans];
  if (st.status === "right") {
    const also = st.alsoNote ? ` <span class="small">(accepted – model answer: <b>${esc(d.keys[0])}</b>)</span>` : "";
    fb = `<div class="fb right"><span class="fb-title">✓ ${esc(d.type === "type" ? st.val : d.opts[st.choice])}</span>${also}<p>${d.why}</p>${d.type === "type" && d.keys.length > 1 ? `<p class="small muted">Also correct: ${d.keys.slice(1).map(esc).join(" · ")}</p>` : ""}${d.page ? `<p class="src">Reader ${esc(d.page)}</p>` : ""}</div>`;
  } else if (st.reveal) {
    fb = `<div class="fb revealed"><span class="fb-title">Answer: ${esc(answer)}</span><p>${d.why}</p>${d.page ? `<p class="src">Reader ${esc(d.page)}</p>` : ""}${d.type === "type" ? '<p class="small muted">Type it in to mark it right.</p>' : ""}</div>`;
  } else if (st.status === "wrong") {
    fb = `<div class="fb wrong"><span class="fb-title">✗ Not quite – try again.</span><div class="btn-row" style="margin-top:8px"><button class="button small" data-dreveal="${d.id}">Show answer</button></div></div>`;
  }
  return `<div class="card drill ${st.status === "right" ? "is-right" : ""}" id="d-${d.id}"><p class="eyebrow">${catLabel}${st.missed ? ' <span class="tag gold">needed a 2nd try</span>' : ""}</p><p class="drill-q">${esc(d.q)}</p>${body}${fb}</div>`;
}
function checkDrill(id, val) {
  const d = DRILLS.find(x => x.id === id); const st = S.drills[id] || {};
  if (d.type === "type") {
    if (!String(val).trim()) return;
    st.val = val;
    if (matchAny(val, d.keys)) { st.status = "right"; st.alsoNote = false; }
    else if (matchAny(val, d.also)) { st.status = "right"; st.alsoNote = true; }
    else { st.status = "wrong"; st.missed = true; }
  } else {
    st.choice = val; st.status = val === d.ans ? "right" : "wrong"; if (st.status === "wrong") st.missed = true;
  }
  S.drills[id] = st; save();
  recentDrills.add(id);
  renderDrills(id);
}

/* ---------- EXAM DAY ---------- */
function renderDay() {
  $("#view-day").innerHTML = `
    <div class="card">
      <div class="task-head"><div><p class="eyebrow">Friday · 9 Oct · 09:00–11:00 · RUB Online-Exam</p>
      <h2>Exam-day rules</h2></div><a class="button small" href="Grammar%20BM%20-%20Resit%20Cheat%20Sheet.pdf" target="_blank" rel="noopener">Cheat sheet (PDF)</a></div>
      <table class="simple">
        <tr><th>When</th><th>Do this</th></tr>
        <tr><td><b>Before every text</b></td><td>Read the <b>whole</b> text once before filling anything. Both text tasks say “taking the whole context into account”.</td></tr>
        <tr><td><b>Non-finites</b></td><td>For every gap ask: does the word before it need a preposition? If yes, type it: <span class="kbd">on travelling</span>, <span class="kbd">in listening</span>. If it is already printed (<i>was used to (do)</i>), type only <span class="kbd">doing</span>.</td></tr>
        <tr><td><b>Tense</b></td><td>Find the narrator’s “now” (will call, regret) vs. the story’s past. Simple past is the default; past perfect only for “earlier than”; progressive for background. If-clauses: look at the main clause first.</td></tr>
        <tr><td><b>Bracketed adverbs</b></td><td>After the first auxiliary: <span class="kbd">had simply reused</span>, <span class="kbd">would not constantly be</span>; before a simple verb: <span class="kbd">permanently kept</span>; degree/manner adverbs after all auxiliaries: <span class="kbd">will have been completely ruined</span>.</td></tr>
        <tr><td><b>Modals</b></td><td>Sure gaps first. Then elimination: if you have used an item twice, check again. Look for signal words: <i>convinced</i> → must · <i>surely … ?</i> → can’t have · <i>…, but</i> → may · <i>better</i> → had · <i>only years later</i> → was to · <i>typical of him</i> → would.</td></tr>
        <tr><td><b>Relatives</b></td><td>Comma test first. Type the comma <b>into</b> the gap: <span class="kbd">, who</span>. Object in a defining clause → <span class="kbd">C</span>. No antecedent → <span class="kbd">what</span>. many/some … → <span class="kbd">of whom</span>.</td></tr>
        <tr><td><b>MC</b></td><td>Underline NOT / do not / how many … not. Condition names go by form. No-inversion list: no doubt, in no time, nevertheless, nonetheless …</td></tr>
        <tr><td><b>Spelling</b></td><td>regre<b>tt</b>ed, sto<b>pp</b>ed, prefe<b>rr</b>ed, trave<b>ll</b>ed (BE). Typos cost the whole point.</td></tr>
      </table>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <p class="eyebrow">Time budget · 90 min</p>
        <table class="simple">
          <tr><td>Non-finites (15)</td><td>12 min</td></tr>
          <tr><td>Tense &amp; aspect (20)</td><td>25 min</td></tr>
          <tr><td>Modals (15)</td><td>15 min</td></tr>
          <tr><td>Relatives (10)</td><td>10 min</td></tr>
          <tr><td>Theory MC (15)</td><td>18 min</td></tr>
          <tr><td>Final check: spelling, commas, prepositions</td><td>10 min</td></tr>
        </table>
        <p class="small muted" style="margin:10px 0 0">In July you used the full 90 minutes. Keep 10 minutes for the final check.</p>
      </div>
      <div class="card">
        <p class="eyebrow">Last 10 minutes before you start</p>
        <ul style="margin:0;padding-left:20px">
          <li>insist <b>on</b> / interested <b>in</b> / used <b>to</b> + -ing</li>
          <li>suggest / consider + <b>-ing</b></li>
          <li>would → if + past · would have → if + past perfect</li>
          <li>must / can’t have · may … but · had better · needn’t · was to · would (typical)</li>
          <li>names → comma · object → C · what · of whom</li>
          <li>contact clause = 0 pronouns · own → my own</li>
        </ul>
      </div>
    </div>
    <div class="note"><p><b>Format note.</b> The July exam had 75 points (four text tasks + 15 MC) and no translation part. The mock test had an extra translation part. If translations come up, the full <a href="../">Grammar Sprint</a> trainer has 35 translation prompts.</p></div>`;
}

/* =========================================================================
   COUNTDOWN · THEME · INIT
   ========================================================================= */
function updateCountdown() {
  const diff = new Date(EXAM_ISO).getTime() - Date.now();
  let txt;
  if (diff <= 0) txt = diff > -2 * 3600e3 ? "Exam in progress – good luck!" : "Exam done";
  else { const h = Math.floor(diff / 3600e3), m = Math.floor((diff % 3600e3) / 60e3); txt = h >= 24 ? `in ${Math.floor(h / 24)} d ${h % 24} h` : `in ${h} h ${m} min`; }
  const c = $("#countdown"); if (c) c.textContent = txt;
  const mc = $("#mini-count"); if (mc) mc.textContent = txt;
}
setInterval(updateCountdown, 30000);

(function initTheme() {
  let t = null; try { t = localStorage.getItem("resitRepair.theme"); } catch (e) {}
  if (t) document.documentElement.setAttribute("data-theme", t);
  $("#theme-btn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("resitRepair.theme", next); } catch (e) {}
  });
})();

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));
showView(S.ui.view || "plan");
updateCountdown();
</script>
